<!DOCTYPE html>
<html>

<head>
    <title>PizthieR.Browser</title>
    <meta charset="UTF-8">

    <!-- Viewport : verrouille le zoom, couvre les encoches iOS -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <base href="/Pizthie-R/">

    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#CC0000" />

    <link rel="stylesheet" href="./app.css" />
    <style>
        html {
            -webkit-text-size-adjust: 100%;
        }

        /* Cle : toutes les entrees ont une police >= 16px pour empecher le focus-zoom iOS */
        input, textarea, select, button {
            font-size: 16px !important;
        }

        #avalonia-input, .avalonia-input, .avalonia-textbox, .av-textbox {
            font-size: 16px !important;
        }

        body {
            touch-action: manipulation;
        }
    </style>
</head>

<body>
    <div id="out">
        <div id="splash"
             style="display:flex; align-items:center; justify-content:center;
                    height:100vh; background:#b22222; color:white; font-family:sans-serif;">
            <h1>Pizza Thierry</h1>
        </div>
    </div>

    <!-- Verrouille le zoom lors du focus sur un champ texte (anti-zoom iOS) -->
    <script>
        (function () {
            var vp = document.querySelector('meta[name=viewport]');
            if (!vp) return;
            function lockZoom() {
                vp.setAttribute('content',
                    'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
            }
            document.addEventListener('focusin', lockZoom);
        })();
    </script>

    <script type='module' src="./main.js"></script>
</body>

</html>
