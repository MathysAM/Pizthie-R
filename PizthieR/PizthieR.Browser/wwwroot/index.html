
<!DOCTYPE html>


<html>



<head>
    <title>PizthieR.Browser</title>
    <meta charset="UTF-8">

    <!-- Viewport : verrouille le zoom, couvre les encoches iOS -->
    <meta name="viewport"
          content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <base href="/Pizthie-R/">

    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#CC0000" />

    <link rel="stylesheet" href="./app.css" />
    <style>
        html {
            -webkit-text-size-adjust: 100%;
        }

        /* Clavier iOS */
        input, textarea, select, button {
            font-size: 16px !important;
        }

        #avalonia-input, .avalonia-input, .avalonia-textbox, .av-textbox {
            font-size: 16px !important;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1C1C1E;
            touch-action: manipulation;
        }

        #out {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1C1C1E;
        }
    </style>

</head>

<body>
    <div id="out">
        <div id="splash"
             style="display:flex; align-items:center; justify-content:center;
                    height:100vh; background:#b22222; color:white; font-family:sans-serif;">
            <h1>Pizza Thierry</h1>
        </div>
    </div>

    <!-- Verrouille le zoom lors du focus sur un champ texte (anti-zoom iOS) -->
    <script>
        (function () {
            var vp = document.querySelector('meta[name=viewport]');
            if (!vp) return;
            function lockZoom() {
                vp.setAttribute('content',
                    'width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no');
            }
            document.addEventListener('focusin', lockZoom);
        })();
    </script>

    <script type='module' src="./main.js"></script>
</body>

</html>
