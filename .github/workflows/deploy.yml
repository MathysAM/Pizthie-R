name: Deploy Avalonia WASM to GitHub Pages

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - NouveauTest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Installation .NET 8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 3) Installation du workload WASM
      - name: Install WASM tools
        run: dotnet workload install wasm-tools

      # 4) Restore + Publish Avalonia Browser
      - name: Publish Avalonia Browser (WASM)
        run: |
          dotnet restore PizthieR/PizthieR.Browser/PizthieR.Browser.csproj
          dotnet publish PizthieR/PizthieR.Browser/PizthieR.Browser.csproj \
            -c Release \
            -f net8.0-browser \
            -o publish

      # 5) Vérification explicite du contenu publié (critique)
      - name: Verify published output (fail if missing)
        run: |
          set -e
          echo "Listing publish/wwwroot:"
          ls -la publish/wwwroot

          echo "Listing publish/wwwroot/_framework:"
          ls -la publish/wwwroot/_framework || true

          if [ ! -f "publish/wwwroot/_framework/avalonia.js" ]; then
            echo "ERROR: publish/wwwroot/_framework/avalonia.js is missing"
            echo "Files in _framework are:"
            ls -la publish/wwwroot/_framework || true
            exit 1
          fi

          echo "OK: avalonia.js found."

      # 6) Déploiement GitHub Pages (Jekyll désactivé)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: publish/wwwroot
          force_orphan: true
          enable_jekyll: false
