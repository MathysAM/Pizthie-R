name: Deploy Avalonia WASM to GitHub Pages

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - NouveauTest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install WASM tools
        run: dotnet workload install wasm-tools

      - name: Publish Avalonia Browser (WASM)
        run: |
          dotnet restore PizthieR/PizthieR.Browser/PizthieR.Browser.csproj
          dotnet publish PizthieR/PizthieR.Browser/PizthieR.Browser.csproj \
            -c Release \
            -f net8.0-browser \
            -o publish \
            /p:BlazorEnableCompression=false \
            /p:CompressionEnabled=false

      - name: Disable Jekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Remove precompressed assets safely (only if uncompressed exists)
        run: |
          set -e
          echo "Deleting .br/.gz ONLY when the uncompressed file exists..."

          shopt -s nullglob

          for f in $(find publish/wwwroot -type f -name "*.br"); do
            base="${f%.br}"
            if [ -f "$base" ]; then
              echo "DELETE: $f (uncompressed exists: $base)"
              rm -f "$f"
            else
              echo "KEEP:   $f (no uncompressed version)"
            fi
          done

          for f in $(find publish/wwwroot -type f -name "*.gz"); do
            base="${f%.gz}"
            if [ -f "$base" ]; then
              echo "DELETE: $f (uncompressed exists: $base)"
              rm -f "$f"
            else
              echo "KEEP:   $f (no uncompressed version)"
            fi
          done

          echo "Done."

      - name: Ensure avalonia.js is available under _framework
        run: |
          set -e
          cp -f publish/wwwroot/avalonia.js publish/wwwroot/_framework/avalonia.js
          if [ -f publish/wwwroot/avalonia.js.map ]; then
            cp -f publish/wwwroot/avalonia.js.map publish/wwwroot/_framework/avalonia.js.map
          fi

      - name: Verify published output
        run: |
          set -e
          test -f publish/wwwroot/_framework/avalonia.js
          echo "OK: publish/wwwroot/_framework/avalonia.js exists"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: publish/wwwroot
          force_orphan: true
          enable_jekyll: false
