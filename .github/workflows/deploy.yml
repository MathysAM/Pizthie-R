name: Deploy Avalonia WASM to GitHub Pages

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - NouveauTest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Installation de .NET 8
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 3) Installation du workload WebAssembly
      - name: Install WASM tools
        run: dotnet workload install wasm-tools

      # 4) Restore + Publish Avalonia Browser
      - name: Publish Avalonia Browser (WASM)
        run: |
          dotnet restore PizthieR/PizthieR.Browser/PizthieR.Browser.csproj
          dotnet publish PizthieR/PizthieR.Browser/PizthieR.Browser.csproj \
            -c Release \
            -f net8.0-browser \
            -o publish \
            /p:BlazorEnableCompression=false \
            /p:CompressionEnabled=false


      - name: Remove precompressed assets for GitHub Pages
        run: |
          find publish/wwwroot -type f \( -name "*.br" -o -name "*.gz" \) -delete


      
      # 5) Workaround : Avalonia cherche avalonia.js dans _framework
      - name: Ensure avalonia.js is available under _framework
        run: |
          set -e
          cp -f publish/wwwroot/avalonia.js publish/wwwroot/_framework/avalonia.js
          if [ -f publish/wwwroot/avalonia.js.map ]; then
            cp -f publish/wwwroot/avalonia.js.map publish/wwwroot/_framework/avalonia.js.map
          fi

      # 6) Vérification explicite (doit exister)
      - name: Verify published output
        run: |
          set -e
          test -f publish/wwwroot/_framework/avalonia.js
          echo "OK: publish/wwwroot/_framework/avalonia.js exists"

      # 7) Déploiement sur GitHub Pages (Jekyll désactivé)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: publish/wwwroot
          force_orphan: true
          enable_jekyll: false
